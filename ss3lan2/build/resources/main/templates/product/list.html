<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<a href="/products/add">add Product</a>
<body>
<table border="1">
    <tr>
        <td>id</td>
        <td>name</td>
        <td>giá</td>
        <td>tên danh mục</td>
        <td>số lượng</td>
        <td>nhà phân phối</td>
        <td>action</td>
    </tr>
    <tr th:each="product : ${products}">
        <td th:text="${product.productId}">id</td>
        <td th:text="${product.productName}">name</td>
        <td th:text="${product.price}">giá</td>
        <td th:text="${product.cate.cateName}">tên danh mục</td>
        <td th:text="${product.quantity}">số lượng</td>
        <td th:text="${product.producer}">nhà phân phối</td>
        <td>action</td>
    </tr>
</table>
</body>
</html>
