<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/categories/add}" method="post" th:object="${category}" class="container mt-5">
    <div class="mb-3">
        <label class="form-label">ID</label>
        <input type="text" class="form-control" th:field="*{cateId}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" th:field="*{cateName}" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
</body>
</html>
