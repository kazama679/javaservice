<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/categories/edit}" method="post" th:object="${category}">
    <div class="mb-3">
        <label class="form-label">ID</label>
        <input type="text" class="form-control" th:field="*{cateId}" readonly>
    </div>
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" th:field="*{cateName}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/categories" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
