<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="container mt-4">
    <h2>Thêm mới nhân viên</h2>
    <form th:action="@{/employees/add}" method="post" th:object="${employee}">
        <div class="mb-3">
            <label class="form-label">Tên</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" class="form-control" th:field="*{phoneNumber}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Lương</label>
            <input type="number" class="form-control" th:field="*{salary}" step="0.01" required>
        </div>
        <div class="mb-3">
            <button type="submit" class="btn btn-primary">Thêm</button>
            <a th:href="@{/employees}" class="btn btn-secondary">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
