<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Chi tiết sinh viên</h2>
<p><strong>ID:</strong> <span th:text="${student.studentId}"></span></p>
<p><strong>Họ tên:</strong> <span th:text="${student.fullName}"></span></p>
<p><strong>Giới tính:</strong> <span th:text="${student.gender ? 'Nam' : 'Nữ'}"></span></p>
<p><strong>Ngày sinh:</strong> <span th:text="${#dates.format(student.birthday, 'dd/MM/yyyy')}"></span></p>
<p><strong>Địa chỉ:</strong> <span th:text="${student.address}"></span></p>
<p><strong>Lớp:</strong> <span th:text="${student.className}"></span></p>
<a th:href="@{/students}">Quay lại danh sách</a>
</body>
</html>
